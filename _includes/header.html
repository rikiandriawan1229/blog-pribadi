<header class="site-header">
  <div class="header-start">
    <button class="menu-btn" type="button" aria-expanded="false" aria-controls="drawer" aria-label="Buka menu">
      <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true" focusable="false">
        <path d="M3 6.5h18M3 12h18M3 17.5h18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"
          fill="none" />
      </svg>
      <img class="menu-favicon" src="{{ '/assets/images/favicon.png' | relative_url }}" alt="">
    </button>

    <a class="home-link" href="{{ '/' | relative_url }}">Beranda</a>
  </div>
</header>

<div class="scrim" hidden></div>
<nav class="drawer" id="drawer" aria-label="Menu utama">
  <div class="drawer-top">
    <span class="drawer-brand brand-mark">{{ site.title }}</span>
    <button class="drawer-close" type="button" aria-label="Tutup menu">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false">
        <path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none" />
      </svg>
    </button>
  </div>
  <ul class="drawer-list">
    {% for item in site.nav %}
    {% if item.url == '/' %}{% continue %}{% endif %}
    {% assign active = false %}
    {% if page.url == item.url %}{% assign active = true %}{% endif %}
    <li>
      <a href="{{ item.url | relative_url }}" {% if active %} class="is-active" aria-current="page" {% endif %}>
        <span class="drawer-title">{{ item.title }}</span>
        {% if item.desc %}<span class="drawer-desc">{{ item.desc }}</span>{% endif %}
      </a>
    </li>
    {% endfor %}
  </ul>
</nav>
