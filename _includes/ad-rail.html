<!--
  Rail iklan kiri & kanan. Hanya tampil di layar sangat lebar (lihat CSS
  .ad-rail di style.css) supaya tidak menabrak konten di layar sempit/HP.

  GANTI data-ad-slot="0000000000" di dua <ins> di bawah dengan Slot ID
  dari unit iklan "Display" yang Anda buat di dashboard AdSense.
  Publisher ID (data-ad-client) otomatis ikut dari _layouts/default.html.
-->
<aside class="ad-rail ad-rail-left" aria-label="Iklan">
  <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-7409236864532850" data-ad-slot="0000000000"
    data-ad-format="auto" data-full-width-responsive="true"></ins>
  <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
</aside>

<aside class="ad-rail ad-rail-right" aria-label="Iklan">
