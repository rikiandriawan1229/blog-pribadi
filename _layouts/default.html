<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="icon" type="image/png" href="{{ '/assets/images/og-default.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/images/og-default.png' | relative_url }}">
  <noscript><style>.menu-btn,.drawer-close{display:none}.drawer{position:static;transform:none;visibility:visible;width:auto;border:0;border-bottom:3px solid}.more-btn{display:none}</style></noscript>
  {% feed_meta %}
  {% seo %}
</head>
<body class="layout-{{ page.layout }}">
  <a class="skip-link" href="#konten">Lewati ke konten</a>
  {% include header.html %}
  <main class="wrapper" id="konten">
    {{ content }}
  </main>
  {% include footer.html %}
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
