title: "Catatan Duck"
short_name: "VOr"
description: "Kebenaran dalam sebuah pilihan — tulisan pribadi berisi olahan informasi, analisis, dan pandangan yang dapat dipertanggungjawabkan."
url: "https://verify-or.duckdns.org"
baseurl: ""
logo: "/assets/images/og-default.png"

# Author
author:
  name: "Penulis"

# Alamat email untuk halaman Kontak (kosongkan jika belum ada)
email: ""

# Menu yang tampil di panel kiri (ikon garis tiga)
nav:
  - title: Beranda
    url: /
    desc: Tulisan terbaru
  - title: Topik
    url: /topik/
    desc: Tulisan per kategori
  - title: Arsip
    url: /arsip/
    desc: Semua tulisan menurut waktu
  - title: Metode & Sumber
    url: /metode/
    desc: Cara tulisan diperiksa
  - title: Tentang
    url: /about/
    desc: Tentang blog ini
  - title: Kontak
    url: /kontak/
    desc: Koreksi dan masukan

# Build settings
markdown: kramdown
permalink: /:year/:month/:day/:title/
timezone: Asia/Makassar

kramdown:
  input: GFM
  syntax_highlighter: rouge

# Paginasi
paginate: 6
paginate_path: "/page:num/"

# Plugin yang dipakai (semua didukung native oleh GitHub Pages)
plugins:
  - jekyll-paginate
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Koleksi default untuk setiap post
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

# File/folder yang tidak perlu ikut di-build
exclude:
  - README.md
  - LICENSE
  - "*.gemspec"
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
